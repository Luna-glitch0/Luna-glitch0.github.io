<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배포 테스트</title>
<style>
  body{font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       max-width:560px;margin:12vh auto;padding:0 6vw;color:#1a1a1a}
  h1{font-size:1.6rem;margin:0 0 .6em}
  code{background:#f0f0f0;padding:.15em .4em;border-radius:4px;font-size:.9em}
  .ok{color:#0a7d32;font-weight:600}
  @media(prefers-color-scheme:dark){
    body{background:#141414;color:#e8e8e8}
    code{background:#2a2a2a}
    .ok{color:#4ade80}
  }
</style>
</head>
<body>
  <h1>배포 테스트</h1>
  <p class="ok">이 페이지가 보이면 배포가 정상 동작합니다.</p>
  <p>로그인하지 않은 사람도 이 링크를 열 수 있습니다. 한글 표시와 다크 모드도 함께 확인하는 페이지입니다.</p>
  <p>다음부터는 <code>./deploy.sh &lt;html파일&gt; &lt;슬러그&gt;</code> 한 줄로 배포됩니다.</p>
</body>
</html>
